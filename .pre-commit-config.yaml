minimum_prek_version: '0.4.0'

repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and import sorting
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
