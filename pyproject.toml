[project]
name = "caval"
version = "0.1.1"
description = "Sovereign Agent with Deterministic Output via Causal Grounding"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.25.0",
    "bitsandbytes>=0.43.0",
    "en-core-web-sm",
    "fastapi>=0.115.0",
    "fuzzywuzzy>=0.18.0",
    "grpcio>=1.58.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.1",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "python-levenshtein>=0.25.0",
    "rdflib>=7.0.0",
    "spacy>=3.7.0",
    "sparqlwrapper>=2.0.0",
    "tenacity>=8.2.0",
    "torch>=2.2.0",
    "transformers>=4.56.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat repo layout: caval/ is the new public package; api/, modules/,
# utils/, common/, experiments/ are its pre-existing internals, still
# importable as top-level packages in their own right (api/main.py, the
# .vscode/launch.json debug configs, etc. all do `import modules.x`/
# `import api.main` directly, not through caval). experiments/ ships
# unmodified because common/llm_integration.py imports
# experiments.caf_algorithm.InferenceLayer as a base class - a real runtime
# dependency of modules/inference_engine/engine.py, not just of the
# experiments/ scripts themselves.
packages = ["caval", "api", "modules", "utils", "common", "experiments"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "prek>=0.4.0",
    "ruff==0.16.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "fuseki: requires a live Fuseki instance reachable at the configured endpoint",
]
