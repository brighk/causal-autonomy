[project]
name = "cauval"
version = "0.1.1"
description = "Sovereign Agent with Deterministic Output via Causal Grounding"
readme = "README.md"
license = "MIT"
authors = [{ name = "Koycho Georgiev", email = "georgievkoycho@gmail.com" }]
keywords = ["llm", "causal-reasoning", "knowledge-graph", "sparql", "rag", "verification", "grounding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
# Core: everything `cauval.Cauval` itself needs (parsing, entity linking,
# SPARQL verification, config) - talks to Fuseki and to an already-running
# inference engine over plain HTTP, so it needs neither a web framework nor
# an ML stack. `common/llm_integration.py` and `modules/inference_engine/
# engine.py` already degrade gracefully (try/except) when torch/
# transformers/bitsandbytes/accelerate aren't installed - confirmed live by
# simulating their absence - so a lean `pip install cauval` genuinely works
# without pulling in a multi-GB ML stack a cauval-only consumer never needs.
dependencies = [
    "fuzzywuzzy>=0.18.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "networkx>=3.2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "python-levenshtein>=0.25.0",
    "spacy>=3.7.0",
    "sparqlwrapper>=2.0.0",
]

[project.optional-dependencies]
# api/main.py's FastAPI gateway, if you want to run it as an HTTP service
# instead of importing `cauval` directly.
api = [
    "fastapi>=0.115.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "uvicorn[standard]>=0.30.0",
]
# modules/inference_engine/server.py's local model loading (the HF/4-bit
# fallback path) - only needed if you're running your own inference
# engine, not if you're pointing cauval at someone else's.
llm = [
    "accelerate>=0.25.0",
    "bitsandbytes>=0.43.0",
    "torch>=2.2.0",
    "transformers>=4.56.0",
]
# experiments/'s benchmark harness and result plotting.
experiments = [
    "matplotlib>=3.8.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/brighk/causal_autonomy"
Repository = "https://github.com/brighk/causal_autonomy"
Issues = "https://github.com/brighk/causal_autonomy/issues"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Allowlist, not a denylist: hatchling's default sdist inclusion swept in
# far more than intended when tested - an untracked PDF sitting in the
# repo root, .claude/settings.local.json (local IDE config), .vscode/,
# deployment/, config/, BACKLOG.md, none of which belong in a public
# package download. Explicit include list means nothing new dropped into
# the repo root can accidentally end up published, without needing to
# remember to exclude it.
include = [
    "/cauval",
    "/api",
    "/modules",
    "/utils",
    "/common",
    "/experiments",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
# Flat repo layout: cauval/ is the new public package; api/, modules/,
# utils/, common/, experiments/ are its pre-existing internals, still
# importable as top-level packages in their own right (api/main.py, the
# .vscode/launch.json debug configs, etc. all do `import modules.x`/
# `import api.main` directly, not through cauval). experiments/ ships
# alongside the rest for anyone using this repo's non-cauval entry points
# (experiments/run_query.py etc.) - common/llm_integration.py no longer
# depends on it (InferenceLayer moved to common/inference_layer.py), so
# cauval's own import chain doesn't require experiments/ to be present.
packages = ["cauval", "api", "modules", "utils", "common", "experiments"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "prek>=0.4.0",
    "ruff==0.16.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # spaCy model, not a runtime dependency of published `cauval` - PyPI has
    # no package literally named en-core-web-sm (confirmed: 404 on PyPI's
    # own index), and [tool.uv.sources] below is a uv-local resolution
    # override that does NOT get embedded in the wheel's published
    # Requires-Dist - a real `pip install cauval` or `uv add cauval` from
    # another project would just fail trying to resolve it from PyPI.
    # Kept here so `uv sync` on this repo still auto-installs it for local
    # dev; anyone consuming the published package instead runs
    # `python -m spacy download en_core_web_sm` once, same as spaCy's own
    # documented pattern for downstream packages - SemanticParser.__init__
    # already raises a clear RuntimeError with that exact command if the
    # model isn't present, so this isn't a silent-failure risk.
    "en-core-web-sm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "fuseki: requires a live Fuseki instance reachable at the configured endpoint",
]
