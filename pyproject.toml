[project]
name = "causal-autonomy"
version = "0.1.1"
description = "Sovereign Agent with Deterministic Output via Causal Grounding"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.25.0",
    "bitsandbytes>=0.43.0",
    "en-core-web-sm",
    "fastapi>=0.115.0",
    "fuzzywuzzy>=0.18.0",
    "grpcio>=1.58.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.1",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "python-levenshtein>=0.25.0",
    "rdflib>=7.0.0",
    "spacy>=3.7.0",
    "sparqlwrapper>=2.0.0",
    "tenacity>=8.2.0",
    "torch>=2.2.0",
    "transformers>=4.56.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
